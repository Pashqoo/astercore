[package]
name = "aster-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Aster execution core speaking MoonProto to MoonTerminal"

[dependencies]
moonproto.workspace = true
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Synchronous HTTP, no Tokio: the core is a thread-per-stream design and a
# runtime would be the only async thing in it. `socks-proxy` is carried from
# the start because a host that cannot reach Aster directly is a deployment
# question (PLAN.md §10), not a code change.
ureq = { version = "3", features = ["json", "socks-proxy"] }
# WebSocket for the market streams, synchronous for the same reason as `ureq`:
# one thread per stream and no runtime (`PLAN.md`, "Транспорт"). Built on the
# rustls already in the tree for `ureq`. The webpki roots are NOT the same crate version:
# `ureq` carries `webpki-roots` 1.x and tungstenite 0.30 asks for 0.26 (both in Cargo.lock);
# the root list is the same data, the two copies are the price of the two crates' pins.
tungstenite = { version = "0.30", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
# Aster v3 signing: EIP-712 over secp256k1 with Keccak-256 (`aster/sign.rs`).
# `k256` 0.13 sits on the same `digest` 0.10 as the `sha3` already in the tree,
# so the pair adds one curve crate rather than a second hashing generation.
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
sha3 = "0.10"
# Already in the tree under `k256`; wipes the key file's text after parsing.
zeroize = "1"

# Deflate and CRC32 for the deal charts the core draws itself (`chart.rs`);
# already in the tree through ureq. TInvestCore's, as is.
flate2 = "1"
# The glyphs of those charts, from `assets/Go-Mono.ttf`.
ab_glyph = "0.2"

# Signals only (M4): `systemctl stop` must be the same graceful stop as the web
# page's button. Already in the tree — moonproto takes it for the same reason.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
